name: Windows compatibility

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-demo:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check the setup and 16-image workflow
        run: |
          python run.py --smoke --device cpu
          python validate_results.py results/demo_16
      - name: Run the default 800-image workflow
        run: |
          python run.py --device cpu
          python validate_results.py results/demo_800
